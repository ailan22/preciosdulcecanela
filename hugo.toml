baseURL = "https://example.com"

# Sitio de una sola página: no hacen falta estas páginas
disableKinds = ["section", "taxonomy", "term", "rss", "robotsTXT"]

defaultContentLanguage = "es"

theme = "hugo-scroll"

# Nombre de la pestaña del navegador
title = "Dulce Canela · Calculadora de precios"

enableEmoji = true

[params]
    favicon = "images/favicon.png"
    title_guard = false
    title = "Dulce Canela · Calculadora de precios"
    description = "Lista de precios por tamaño y calculador de costo de recetas de Dulce Canela"
    language_menu = false
    show_current_lang = false
    copyright = "© Dulce Canela"
    hidedesignbyline = false
    invertSectionColors = false
    image_options = "webp q90 lanczos photo"
    combine_page_and_site_title = false

    [params.footer]
    showContactIcons = false
    showFooterLinks = false

    [params.meta]
        keywords = "dulce canela, tortas, precios, recetas"

[languages]
  [languages.es]
    weight = 10
    label = "Español"
    contentDir = "content/es"
